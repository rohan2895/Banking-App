server:
  port: 8082
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:acctdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
jwt:
  secret: "change-me-super-secret"
  issuer: "bank-auth"
